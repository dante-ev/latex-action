# heylogs configuration — consumed by `heylogs check` (.github/workflows/check-changelog.yml).
#
# Findings & rationale (2026-06, when the CHANGELOG check was added):
# Only ERROR-level rules fail CI; WARN/INFO do not (exit code stays 0). So the
# `unknown-link-type` warnings on the docker-texlive release links are left
# enabled — they don't break the build.
#
# The rules below are disabled because they clash with the "## [edge]" rolling
# section, which is kept dateless and named "edge" on purpose (it maps to the
# :edge docker tag and the [edge] compare link):
#
#   date-displayed           - "## [edge]" has no date.
#   all-h2-contain-a-version - "## [edge]" is not a versioned release.
#
# Fixed in the changelog instead of disabled:
#   - http:// -> https:// (the `https` rule stays ON).
#   - every release now groups its entries under "### Added"/"### Changed", so
#     `no-empty-release` stays ON and passes (it flags the first release lacking
#     grouped entries, cascading top-down, so all releases need a group).
#
# Rule ids: https://github.com/nbbrd/heylogs
rules=date-displayed:OFF,all-h2-contain-a-version:OFF
